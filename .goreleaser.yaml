version: 2
before:
  hooks:
    - go mod tidy
builds:
  # =====================================================================================
  # single pure-Go build for linux + darwin + windows (Bubble Tea TUI, no CGO)
  # =====================================================================================
  - id: todo
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/candy-tools/todo/app/metainfo.Version={{.Version}}
      - -X github.com/candy-tools/todo/app/metainfo.Commit={{.Commit}}
      - -X github.com/candy-tools/todo/app/metainfo.BuildTime={{.Date}}
    binary: todo

archives:
  - formats: [tar.gz]
    # windows users expect a .zip rather than a tarball.
    format_overrides:
      - goos: windows
        formats: [zip]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      todo_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

nfpms:
  # build a .deb for linux. only linux builds are packaged; the darwin and
  # windows binaries are skipped automatically.
  - id: todo
    package_name: todo
    ids:
      - todo
    formats:
      - deb
    maintainer: "Andres Bott <contact@andresbott.com>"
    homepage: "https://github.com/candy-tools/todo"
    description: "Keyboard-driven terminal TODO manager backed by plain Markdown files"
    license: "GPL-3.0"
    section: utils
    priority: optional
    contents:
      - src: LICENSE
        dst: /usr/share/doc/todo/copyright
    deb:
      # the go binary is statically linked (CGO_ENABLED=0); silence lintian.
      lintian_overrides:
        - statically-linked-binary

homebrew_casks:
  # publish a macOS cask into the dedicated tap repo (candy-tools/homebrew-tap,
  # Casks/todo.rb). linux is distributed as a .deb and windows as a .zip, so a
  # macOS-only cask is fine — and it's the non-deprecated successor to `brews`.
  # pushing to a *different* repo needs a cross-repo PAT; the default
  # GITHUB_TOKEN is scoped to this repo only. see HOMEBREW_TAP_GITHUB_TOKEN in
  # .github/workflows/release.yml.
  - name: todo
    binaries:
      - todo
    repository:
      owner: candy-tools
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: Andres Bott
      email: contact@andresbott.com
    homepage: "https://github.com/candy-tools/todo"
    description: "Keyboard-driven terminal TODO manager backed by plain Markdown files"
    # the darwin binary isn't code-signed/notarized, so strip the Gatekeeper
    # quarantine attribute on install to avoid a "todo is damaged" error.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/todo"]
          end

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
