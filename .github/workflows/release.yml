name: Release
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

# goreleaser needs write access to publish the release and upload assets
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # full history + tags are required for the changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cross-repo PAT so goreleaser can push the cask to candy-tools/homebrew-tap
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Register the .deb with the Debian repo
        # after goreleaser writes the .deb into dist/, hand it to
        # candy-tools/debian-repo: the action writes packages/todo.json there
        # and pushes it, which triggers a publish. needs a cross-repo PAT with
        # contents:read+write on candy-tools/debian-repo (DEBIAN_REPO_TOKEN);
        # the default GITHUB_TOKEN is scoped to this repo only, same reason as
        # HOMEBREW_TAP_GITHUB_TOKEN above.
        uses: candy-tools/debian-repo/.github/actions/register@main
        with:
          name: todo          # must match the .deb's Package field (nfpms package_name)
          dist-dir: dist      # where goreleaser wrote the .deb files
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
